<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ARGUS · Orbital Awareness Console</title>
  <meta name="description" content="Real-time orbital situational awareness: satellites, debris, conjunction risk, near-Earth asteroids, night-sky impact, and pointing for a robotic tracking mount.">
  <meta name="theme-color" content="#05070c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%234ea8ff'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='5.5' fill='none' stroke='%23e7ecf5' stroke-width='2' transform='rotate(-22 16 16)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three.module.js",
      "three/OrbitControls": "/vendor/OrbitControls.js",
      "satellite.js": "/vendor/satellite.js",
      "astronomy-engine": "/vendor/astronomy.js"
    }
  }
  </script>
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <canvas id="scene" aria-label="Interactive 3D globe showing satellites, debris and near-Earth objects"></canvas>
  <div id="labels" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="5" fill="var(--accent)"/>
        <ellipse cx="16" cy="16" rx="13" ry="5.5" fill="none" stroke="currentColor" stroke-width="1.6" transform="rotate(-22 16 16)"/>
        <circle cx="27.6" cy="11.4" r="1.8" fill="currentColor"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">ARGUS</span>
        <span class="brand-sub">Orbital Awareness Console</span>
      </div>
    </div>

    <div class="clock" id="clock">
      <span class="mode-badge live" id="modeBadge">LIVE</span>
      <div class="clock-main">
        <span class="clock-time mono" id="clockTime">--:--:--</span>
        <span class="clock-date mono" id="clockDate">UTC</span>
      </div>
      <div class="time-controls" role="group" aria-label="Simulation time">
        <button class="icon-btn" data-time="slower" title="Slower / reverse (−)">
          <svg viewBox="0 0 20 20"><path d="M9 5 4 10l5 5M16 5l-5 5 5 5"/></svg>
        </button>
        <button class="icon-btn" data-time="pause" title="Pause / resume (space)" id="pauseBtn">
          <svg viewBox="0 0 20 20"><path d="M7 5v10M13 5v10"/></svg>
        </button>
        <button class="icon-btn" data-time="faster" title="Faster (+)">
          <svg viewBox="0 0 20 20"><path d="m11 5 5 5-5 5M4 5l5 5-5 5"/></svg>
        </button>
        <span class="rate mono" id="rateLabel">×1</span>
        <button class="pill-btn" data-time="live" title="Return to real time (L)">Live</button>
      </div>
    </div>

    <div class="topbar-right">
      <form class="place-search" id="placeForm" role="search" autocomplete="off">
        <svg viewBox="0 0 20 20"><circle cx="8.8" cy="8.8" r="5.6"/><path d="m13 13 4.6 4.6"/></svg>
        <input id="placeInput" type="search" placeholder="Go to a place… e.g. Scarborough Town Centre" aria-label="Go to a place" spellcheck="false">
        <div class="place-results hidden" id="placeResults"></div>
      </form>
      <button class="observer-btn" id="observerBtn" title="Observer / mount location">
        <svg viewBox="0 0 20 20"><path d="M10 18s6-5.6 6-10a6 6 0 1 0-12 0c0 4.4 6 10 6 10Z"/><circle cx="10" cy="8" r="2.2"/></svg>
        <span id="observerLabel" class="mono">Locating…</span>
      </button>
      <button class="feeds-btn" id="feedsBtn" title="Data feeds">
        <span class="dot" id="feedsDot"></span><span id="feedsLabel">Feeds</span>
      </button>
    </div>
  </header>

  <nav class="rail" aria-label="Panels">
    <button data-tab="place" title="Location — what is above a place, and the close approaches in its sky"><svg viewBox="0 0 20 20"><path d="M10 18s6-5.6 6-10a6 6 0 1 0-12 0c0 4.4 6 10 6 10Z"/><circle cx="10" cy="8" r="2.2"/></svg><span>Location</span></button>
    <button data-tab="catalog" title="Catalog & layers"><svg viewBox="0 0 20 20"><path d="M10 2.5 2.5 6.5 10 10.5l7.5-4L10 2.5Z"/><path d="m2.5 10 7.5 4 7.5-4"/><path d="m2.5 13.5 7.5 4 7.5-4"/></svg><span>Catalog</span></button>
    <button data-tab="risk" title="Collision risk"><svg viewBox="0 0 20 20"><ellipse cx="10" cy="10" rx="8" ry="3.2" transform="rotate(28 10 10)"/><ellipse cx="10" cy="10" rx="8" ry="3.2" transform="rotate(-28 10 10)"/><circle cx="10" cy="10" r="1.4" class="fill"/></svg><span>Risk</span></button>
    <button data-tab="environment" title="Orbital environment & sustainability"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="4.2"/><ellipse cx="10" cy="10" rx="8.6" ry="3.1"/><path d="M5.9 8.6c2.4.6 5.6.6 8.2 0"/></svg><span>Environ.</span></button>
    <button data-tab="sky" title="Night-sky impact"><svg viewBox="0 0 20 20"><path d="M13.8 13.6A6.2 6.2 0 0 1 8.3 3.9a6.3 6.3 0 1 0 5.5 9.7Z"/><path d="M15 3.2v3M13.5 4.7h3"/></svg><span>Night sky</span></button>
    <button data-tab="neo" title="Near-Earth asteroids"><svg viewBox="0 0 20 20"><path d="M6.2 4.6 11 3l4.6 2.8 1.4 4.6-2.6 4.8-5.6 1.4-4.4-3.2-.8-4.8 2.6-4Z"/><circle cx="8.6" cy="8" r="1.3"/><circle cx="12.6" cy="12" r="1.7"/></svg><span>Asteroids</span></button>
    <button data-tab="earth" title="Earth events & space weather"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.3"/><path d="M10 2v2.2M10 15.8V18M2 10h2.2M15.8 10H18M4.4 4.4l1.5 1.5M14.1 14.1l1.5 1.5M4.4 15.6l1.5-1.5M14.1 5.9l1.5-1.5"/></svg><span>Space Wx</span></button>
    <button data-tab="mount" title="Tracking mount (ESP32-S3)"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.4"/><path d="M10 1.6v4M10 14.4v4M1.6 10h4M14.4 10h4"/><circle cx="10" cy="10" r="1.2" class="fill"/></svg><span>Mount</span></button>
    <button data-tab="search" title="Search objects"><svg viewBox="0 0 20 20"><circle cx="8.8" cy="8.8" r="5.6"/><path d="m13 13 4.6 4.6"/></svg><span>Search</span></button>
  </nav>

  <aside class="drawer" id="drawer" aria-label="Panel">
    <div class="drawer-head">
      <h2 id="drawerTitle">Catalog</h2>
      <button class="icon-btn" id="drawerClose" title="Close panel"><svg viewBox="0 0 20 20"><path d="m5 5 10 10M15 5 5 15"/></svg></button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <aside class="inspector hidden" id="inspector" aria-label="Selected object"></aside>

  <div class="hud hud-mount" id="mountHud"></div>

  <div class="hud hud-view">
    <div class="seg" role="group" aria-label="View">
      <button class="active" data-view="orbital" title="Orbital view (O)">Orbital</button>
      <button data-view="sky" title="Sky view from the observer — the mount follows where you look (V)">Sky view</button>
    </div>
    <button class="icon-btn" id="resetView" title="Reset camera (R)"><svg viewBox="0 0 20 20"><path d="M4 10a6 6 0 1 0 1.8-4.3"/><path d="M4 3.5v3.6h3.6"/></svg></button>
  </div>

  <div class="hud hud-encounter hidden" id="encounterHud"></div>
  <div class="hud hud-legend" id="legend"></div>
  <div class="tooltip hidden" id="tooltip" role="status"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="popover hidden" id="popover"></div>

  <div class="boot" id="boot">
    <div class="boot-card">
      <svg class="boot-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="5" fill="var(--accent)"/>
        <ellipse cx="16" cy="16" rx="13" ry="5.5" fill="none" stroke="currentColor" stroke-width="1.4" transform="rotate(-22 16 16)"/>
        <circle class="boot-sat" cx="27.6" cy="11.4" r="1.8" fill="currentColor"/>
      </svg>
      <h1>ARGUS</h1>
      <p>Orbital Awareness Console</p>
      <ul class="boot-steps" id="bootSteps"></ul>
    </div>
  </div>
  <noscript><div class="noscript">ARGUS needs JavaScript and WebGL.</div></noscript>
</body>
</html>
